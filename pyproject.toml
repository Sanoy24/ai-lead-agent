[project]
name = "ai-lead-agent"
version = "0.1.0"
description = "AI speed-to-lead agent for service businesses: replies to new leads in under a minute, qualifies them, books meetings and follows up."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yonas Mekonnen" }]
requires-python = ">=3.12"
keywords = ["ai-agent", "lead-generation", "speed-to-lead", "sales-automation", "crm", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0.36",
  "tzdata>=2026.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
lead-agent = "lead_agent.__main__:main"

[project.urls]
Repository = "https://github.com/Sanoy24/ai-lead-agent"
Issues = "https://github.com/Sanoy24/ai-lead-agent/issues"
Changelog = "https://github.com/Sanoy24/ai-lead-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_agent"]
artifacts = ["src/lead_agent/web/dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
